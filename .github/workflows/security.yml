name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so the vulnerability database is refreshed even without pushes.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validity:
    name: Workflow and Dockerfile validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

      - name: hadolint
        run: |
          status=0
          for file in apps/api/Dockerfile apps/web/Dockerfile; do
            echo "::group::$file"
            docker run --rm -v "$PWD:/repo" -w /repo hadolint/hadolint:2.12.0 \
              hadolint --config /repo/.hadolint.yaml "$file" || status=$?
            echo "::endgroup::"
          done
          exit $status

  trivy-fs:
    name: Trivy (dependencies, secrets, misconfiguration)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Gate on fixable high and critical findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Scan configuration too (report only)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          severity: CRITICAL,HIGH
          format: table
          exit-code: "0"

      - name: Produce SARIF
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"

      # Code scanning needs GitHub Advanced Security on a private repository.
      # Until it is enabled this upload is refused; it must not fail the build.
      - name: Upload SARIF to the code scanning tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  trivy-images:
    name: Trivy (image ${{ matrix.name }})
    # Building both images takes a while; keep it off pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Build ${{ matrix.name }}
        run: |
          docker build \
            --file "${{ matrix.dockerfile }}" \
            --tag "dasa122-${{ matrix.name }}:${{ github.sha }}" \
            .

      - name: Scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: dasa122-${{ matrix.name }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"
